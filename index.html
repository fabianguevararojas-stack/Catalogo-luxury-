<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Luxury – Moda y Estilo</title>
<meta name="description" content="Catálogo Luxury - Moda y Estilo">
<meta name="theme-color" content="#1D1C1A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<style>
  :root {
    --color-bg: #1D1C1A;
    --color-ink: #EDE6D9;
    --color-primary: #C9972E;
    --color-primary-light: #A79A85;
    --color-card: #262420;
    --color-line: #3D382E;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(env(safe-area-inset-bottom) + 32px);
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 18px; }
  .hero { padding-top: calc(env(safe-area-inset-top) + 30px); padding-bottom: 6px; text-align: center; }
  .hero img { display: block; width: 190px; max-width: 60%; margin: 0 auto; }

  .tabs {
    display: flex; gap: 20px; overflow-x: auto; padding: 16px 0 10px;
    margin-bottom: 18px; border-bottom: 1px solid var(--color-line);
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none; border: none; font-size: 15px; color: var(--color-primary-light);
    padding: 6px 2px 12px; white-space: nowrap; position: relative; cursor: pointer;
    font-family: inherit;
  }
  .tab.activa { color: var(--color-primary); font-weight: 600; }
  .tab.activa::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
    background: var(--color-primary);
  }

  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .tarjeta { background: var(--color-card); border: 1px solid var(--color-line); border-radius: 4px; overflow: hidden; }
  .tarjeta img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; }
  .tarjeta .info { padding: 14px 16px 16px; }
  .categoria-tag { font-size: 12px; color: var(--color-primary-light); }
  .descripcion { margin: 6px 0 12px; font-size: 15px; line-height: 1.4; }
  .fila-inferior { display: flex; justify-content: flex-end; border-top: 1px solid var(--color-line); padding-top: 10px; }
  .precio {
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    font-size: 21px;
    background: linear-gradient(135deg, #F0D9A8 0%, #C9972E 55%, #8B6914 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    color: var(--color-primary);
  }

  .vacio { text-align: center; padding: 60px 20px; color: var(--color-primary-light); font-size: 14px; line-height: 1.6; }
  .pie { text-align: center; font-size: 12.5px; color: var(--color-primary-light); margin: 34px 0 10px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

  </main>
  <p class="pie">Luxury &middot; Moda y Estilo</p>
</div>
<script type="module">
// Catálogo de SOLO LECTURA: lee en vivo desde Firestore (misma base de
// datos donde se publica desde la app privada). No hace falta iniciar
// sesión para ver — eso lo permiten las reglas de seguridad del proyecto.
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import { getFirestore, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCyOFNMosBH-Rxr1ivqVOVymx6BHti0HFU",
  authDomain: "catalogo-luxury-f0fa4.firebaseapp.com",
  projectId: "catalogo-luxury-f0fa4",
  storageBucket: "catalogo-luxury-f0fa4.firebasestorage.app",
  messagingSenderId: "954813705120",
  appId: "1:954813705120:web:9c12a34b6edfc138cd92c5"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

let productos = [];
let categorias = [];
let categoriaActiva = 'Todas';

function escaparHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function formatearPrecio(valor) {
  return 'Q' + Number(valor).toFixed(2);
}

function renderPestanas() {
  const cont = document.getElementById('tabsCategorias');
  if (categorias.length === 0) { cont.style.display = 'none'; return; }
  cont.style.display = 'flex';
  const todas = ['Todas'].concat(categorias);
  cont.innerHTML = todas.map((cat) => {
    const clase = cat === categoriaActiva ? 'tab activa' : 'tab';
    return '<button class="' + clase + '" data-cat="' + escaparHTML(cat) + '">' + escaparHTML(cat) + '</button>';
  }).join('');
  cont.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      categoriaActiva = btn.dataset.cat;
      renderPestanas();
      renderGrid();
    });
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtrados = categoriaActiva === 'Todas'
    ? productos
    : productos.filter((p) => p.categoria === categoriaActiva);

  if (filtrados.length === 0) {
    grid.innerHTML = '<div class="vacio"><p>Todavía no hay productos aquí.</p></div>';
    return;
  }

  grid.innerHTML = filtrados
    .slice()
    .sort((a, b) => (b.fecha || 0) - (a.fecha || 0))
    .map((p) => (
      '<article class="tarjeta">'
      + '<img src="' + p.foto + '" alt="' + escaparHTML(p.descripcion) + '" loading="lazy">'
      + '<div class="info">'
      + '<span class="categoria-tag">' + escaparHTML(p.categoria) + '</span>'
      + '<p class="descripcion">' + escaparHTML(p.descripcion) + '</p>'
      + '<div class="fila-inferior"><span class="precio">' + formatearPrecio(p.precio) + '</span></div>'
      + '</div></article>'
    )).join('');
}

onSnapshot(collection(db, 'productos'), (snapshot) => {
  productos = snapshot.docs.map((d) => Object.assign({ id: d.id }, d.data()));
  categorias = Array.from(new Set(productos.map((p) => p.categoria))).sort();
  renderPestanas();
  renderGrid();
}, () => {
  document.getElementById('grid').innerHTML =
    '<div class="vacio"><p>No se pudo cargar el catálogo. Intenta de nuevo en un momento.</p></div>';
});
</script>

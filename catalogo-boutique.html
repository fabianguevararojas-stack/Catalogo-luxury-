<style>
  :root {
    --color-bg: #1D1C1A;
    --color-ink: #EDE6D9;
    --color-primary: #C9972E;
    --color-primary-light: #A79A85;
    --color-accent: #F0D9A8;
    --color-card: #262420;
    --color-line: #3D382E;
    --color-danger: #C1573E;
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--color-bg);
    color: var(--color-ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(env(safe-area-inset-bottom) + 32px);
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 18px; }
  .oculto { display: none; }

  .hero {
    padding-top: calc(env(safe-area-inset-top) + 30px);
    padding-bottom: 22px;
    text-align: center;
  }
  .hero .logo { display: block; width: 190px; max-width: 60%; margin: 0 auto; }

  /* ---- Acceso (login / registro) ---- */
  .pantalla-login { max-width: 340px; margin: 10px auto 40px; }
  .pantalla-login h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    color: var(--color-primary);
    text-align: center;
    margin: 0 0 24px;
  }
  .pantalla-login label { display: block; font-size: 13px; color: var(--color-primary-light); margin-bottom: 14px; }
  .pantalla-login input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 0;
    font-size: 16px;
    font-family: var(--font-body);
    color: var(--color-ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--color-line);
  }
  .pantalla-login input:focus { outline: none; border-bottom-color: var(--color-primary); }
  .pantalla-login .boton-primario { width: 100%; margin-top: 10px; }
  .pantalla-login .boton-texto { display: block; width: 100%; text-align: center; margin-top: 16px; }
  .login-error { color: var(--color-danger); font-size: 13px; margin: 2px 0 6px; min-height: 1.1em; }

  .tabs {
    display: flex;
    gap: 20px;
    overflow-x: auto;
    padding-bottom: 10px;
    margin-bottom: 18px;
    border-bottom: 1px solid var(--color-line);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: none;
    border: none;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--color-primary-light);
    padding: 6px 2px 12px;
    white-space: nowrap;
    position: relative;
    cursor: pointer;
  }
  .tab.activa { color: var(--color-primary); font-weight: 600; }
  .tab.activa::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 2px;
    background: var(--color-primary);
  }

  .acciones-principales { display: flex; gap: 12px; margin-bottom: 22px; }
  .boton-primario {
    flex: 1;
    background: var(--color-primary);
    color: var(--color-bg);
    border: none;
    border-radius: 3px;
    padding: 13px 16px;
    font-size: 15px;
    font-family: var(--font-body);
    cursor: pointer;
  }
  .boton-primario:active { background: #8B6914; }

  .boton-texto {
    background: none;
    border: none;
    color: var(--color-primary-light);
    font-size: 14px;
    text-decoration: underline;
    cursor: pointer;
    padding: 13px 4px;
  }

  .boton-secundario {
    background: var(--color-bg);
    border: 1px solid var(--color-primary);
    color: var(--color-primary);
    border-radius: 3px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
  }

  .panel {
    background: var(--color-card);
    border: 1px solid var(--color-line);
    border-radius: 4px;
    padding: 20px;
    margin-bottom: 22px;
  }
  .panel.oculto { display: none; }
  .panel h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 20px;
    color: var(--color-primary);
    margin: 0 0 16px;
  }

  #formProducto label { display: block; font-size: 13px; color: var(--color-primary-light); margin-bottom: 14px; }
  #formProducto input, #formProducto select {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 0;
    font-size: 16px;
    font-family: var(--font-body);
    color: var(--color-ink);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--color-line);
  }
  #formProducto input:focus, #formProducto select:focus { outline: none; border-bottom-color: var(--color-primary); }
  #formProducto input[type="file"] { border-bottom: none; padding: 6px 0; }

  .preview-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 3px; margin-bottom: 8px; }
  .cargando, .error { font-size: 13px; color: var(--color-primary-light); }
  .error { color: var(--color-danger); }

  .acciones-form { display: flex; justify-content: flex-end; gap: 16px; margin-top: 6px; }

  .lista-categorias { list-style: none; padding: 0; margin: 0 0 16px; }
  .lista-categorias li {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid var(--color-line);
    font-size: 15px;
  }
  .lista-categorias li:last-child { border-bottom: none; }
  .quitar-categoria { background: none; border: none; color: var(--color-danger); font-size: 13px; text-decoration: underline; cursor: pointer; }
  .fila-nueva-categoria { display: flex; gap: 10px; }
  .fila-nueva-categoria input {
    flex: 1;
    padding: 10px;
    font-size: 16px;
    color: var(--color-ink);
    background: var(--color-bg);
    border: 1px solid var(--color-line);
    border-radius: 3px;
    font-family: var(--font-body);
  }

  .grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
  .tarjeta { background: var(--color-card); border: 1px solid var(--color-line); border-radius: 4px; overflow: hidden; }
  .tarjeta img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; cursor: pointer; }

  .visor-foto {
    position: fixed; inset: 0; background: rgba(10, 9, 8, 0.94);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 200;
  }
  .visor-foto.oculto { display: none; }
  .visor-foto img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
  .cerrar-visor {
    position: absolute;
    top: calc(env(safe-area-inset-top) + 16px);
    right: 20px;
    width: 40px; height: 40px;
    background: rgba(255, 255, 255, 0.12);
    border: none;
    border-radius: 50%;
    color: var(--color-ink);
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
  }
  .tarjeta .info { padding: 14px 16px 16px; }
  .categoria-tag { font-size: 12px; color: var(--color-primary-light); }
  .descripcion { margin: 6px 0 12px; font-size: 15px; line-height: 1.4; }
  .fila-inferior {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--color-line);
    padding-top: 10px;
  }
  .precio {
    font-family: var(--font-display);
    font-size: 21px;
    color: var(--color-primary);
    background: linear-gradient(135deg, #F0D9A8 0%, #C9972E 55%, #8B6914 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .eliminar { background: none; border: none; color: var(--color-danger); font-size: 13px; text-decoration: underline; cursor: pointer; }
  .eliminar.confirmando {
    color: var(--color-bg);
    background: var(--color-danger);
    text-decoration: none;
    padding: 5px 9px;
    border-radius: 3px;
    font-size: 12px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom) + 20px);
    transform: translateX(-50%) translateY(12px);
    background: var(--color-card);
    border: 1px solid var(--color-line);
    color: var(--color-ink);
    padding: 12px 18px;
    border-radius: 4px;
    font-size: 14px;
    max-width: 85%;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
  }
  .toast.mostrar { opacity: 1; transform: translateX(-50%) translateY(0); }

  .vacio { text-align: center; padding: 40px 20px; color: var(--color-primary-light); }
  .vacio p { margin-bottom: 16px; }

  .nota-pie { text-align: center; font-size: 12.5px; color: var(--color-primary-light); margin-top: 30px; line-height: 1.5; }

  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--color-primary);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

// ---- Utilidades ----
function escaparHTML(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function formatearPrecio(valor) {
  return 'Q' + Number(valor).toFixed(2);
}
function mostrarAviso(mensaje) {
  let toast = document.getElementById('avisoToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'avisoToast';
    toast.className = 'toast';
    document.body.appendChild(toast);
  }
  toast.textContent = mensaje;
  toast.classList.add('mostrar');
  clearTimeout(toast._temporizador);
  toast._temporizador = setTimeout(() => toast.classList.remove('mostrar'), 2800);
}

// ---- Fotos ----
// Redimensionamos antes de guardar (cada producto vive en un documento
// de Firestore con límite de 1MB) pero usando la mejor calidad posible:
// probamos alta resolución y alta calidad, y solo bajamos un poco si esa
// foto en particular pesa demasiado para guardarla.
function procesarFoto(file, maxAncho) {
  maxAncho = maxAncho || 1600;
  return new Promise((resolve, reject) => {
    const lector = new FileReader();
    lector.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const escala = Math.min(1, maxAncho / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * escala);
        canvas.height = Math.round(img.height * escala);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        let calidad = 0.9;
        let resultado = canvas.toDataURL('image/jpeg', calidad);
        while (resultado.length > 900000 && calidad > 0.5) {
          calidad -= 0.1;
          resultado = canvas.toDataURL('image/jpeg', calidad);
        }
        resolve(resultado);
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    lector.onerror = () => reject(new Error('No se pudo leer el archivo'));
    lector.readAsDataURL(file);
  });
}
function crearFotoDeMuestra(etiqueta, colorFondo) {
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="750" viewBox="0 0 600 750">'
    + '<rect width="600" height="750" fill="' + colorFondo + '"/>'
    + '<text x="300" y="390" font-family="Georgia, serif" font-size="34" fill="#C9972E" text-anchor="middle">' + etiqueta + '</text>'
    + '<text x="300" y="430" font-family="Georgia, serif" font-size="16" fill="#EDE6D9" text-anchor="middle" opacity="0.6">foto de muestra</text>'
    + '</svg>';
  return 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
}

function traducirErrorAuth(codigo) {
  const mensajes = {
    'auth/invalid-email': 'Ese correo no es válido.',
    'auth/user-not-found': 'No existe una cuenta con ese correo.',
    'auth/wrong-password': 'La contraseña no es correcta.',
    'auth/invalid-credential': 'Correo o contraseña incorrectos.',
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo — inicia sesión en vez de crear una nueva.',
    'auth/weak-password': 'La contraseña necesita al menos 6 caracteres.',
    'auth/too-many-requests': 'Demasiados intentos, espera un momento e intenta de nuevo.'
  };
  return mensajes[codigo] || 'Ocurrió un error, intenta de nuevo.';
}

document.getElementById('formLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorDiv = document.getElementById('loginError');
  errorDiv.textContent = '';
  try {
    await signInWithEmailAndPassword(auth, email, password);
  } catch (err) {
    errorDiv.textContent = traducirErrorAuth(err.code);
  }
});

document.getElementById('formRegistro').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('registroEmail').value.trim();
  const password = document.getElementById('registroPassword').value;
  const errorDiv = document.getElementById('registroError');
  errorDiv.textContent = '';
  try {
    await createUserWithEmailAndPassword(auth, email, password);
  } catch (err) {
    errorDiv.textContent = traducirErrorAuth(err.code);
  }
});

document.getElementById('btnIrRegistro').addEventListener('click', () => {
  document.getElementById('formLogin').classList.add('oculto');
  document.getElementById('btnIrRegistro').classList.add('oculto');
  document.getElementById('formRegistro').classList.remove('oculto');
  document.getElementById('btnIrLogin').classList.remove('oculto');
});
document.getElementById('btnIrLogin').addEventListener('click', () => {
  document.getElementById('formRegistro').classList.add('oculto');
  document.getElementById('btnIrLogin').classList.add('oculto');
  document.getElementById('formLogin').classList.remove('oculto');
  document.getElementById('btnIrRegistro').classList.remove('oculto');
});

document.getElementById('btnCerrarSesion').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, (user) => {
  const pantallaLogin = document.getElementById('pantallaLogin');
  const appPrincipal = document.getElementById('appPrincipal');
  if (user) {
    pantallaLogin.classList.add('oculto');
    appPrincipal.classList.remove('oculto');
    document.getElementById('correoActual').textContent = user.email;
    iniciarDatos();
  } else {
    pantallaLogin.classList.remove('oculto');
    appPrincipal.classList.add('oculto');
  }
});

// ---- Datos en vivo (Firestore) ----
async function sembrarSiVacio() {
  const snap = await getDocs(collection(db, 'productos'));
  if (!snap.empty) return;
  const muestras = [
    { descripcion: 'Vestido midi floral, manga larga', precio: 285, categoria: 'Vestidos', color: '#2A2420' },
    { descripcion: 'Sandalias de tacón bajo, tono nude', precio: 195, categoria: 'Calzado', color: '#242019' },
    { descripcion: 'Pantalón palazzo, corte fluido', precio: 220, categoria: 'Pantalones', color: '#2E2620' },
    { descripcion: 'Perfume floral amaderado, 50ml', precio: 340, categoria: 'Perfumes', color: '#221D18' }
  ];
  for (const m of muestras) {
    await addDoc(collection(db, 'productos'), {
      foto: crearFotoDeMuestra(m.categoria, m.color),
      descripcion: m.descripcion,
      precio: m.precio,
      categoria: m.categoria,
      fecha: Date.now()
    });
  }
}

async function iniciarDatos() {
  if (escuchandoDatos) return;
  escuchandoDatos = true;

  try { await sembrarSiVacio(); } catch (err) { /* no es crítico si falla */ }

  onSnapshot(collection(db, 'productos'), (snapshot) => {
    productosCache = snapshot.docs.map((d) => Object.assign({ id: d.id }, d.data()));
    renderGrid();
  }, () => mostrarAviso('No se pudieron cargar los productos.'));

  onSnapshot(doc(db, 'config', 'categorias'), async (snap) => {
    if (snap.exists() && Array.isArray(snap.data().lista) && snap.data().lista.length) {
      categorias = snap.data().lista;
    } else if (!snap.exists()) {
      categorias = ['Vestidos', 'Calzado', 'Pantalones', 'Perfumes'];
      try { await setDoc(doc(db, 'config', 'categorias'), { lista: categorias }); } catch (err) {}
    }
    renderPestanas();
    poblarSelectCategorias();
    renderListaCategorias();
  });
}

// ---- Render ----
function renderPestanas() {
  const cont = document.getElementById('tabsCategorias');
  const todas = ['Todas'].concat(categorias);
  cont.innerHTML = todas.map((cat) => {
    const clase = cat === categoriaActiva ? 'tab activa' : 'tab';
    return '<button class="' + clase + '" data-cat="' + escaparHTML(cat) + '">' + escaparHTML(cat) + '</button>';
  }).join('');
  cont.querySelectorAll('.tab').forEach((btn) => {
    btn.addEventListener('click', () => {
      categoriaActiva = btn.dataset.cat;
      renderPestanas();
      renderGrid();
    });
  });
}

function renderGrid() {
  const grid = document.getElementById('grid');
  const filtrados = categoriaActiva === 'Todas'
    ? productosCache
    : productosCache.filter((p) => p.categoria === categoriaActiva);

  if (filtrados.length === 0) {
    const extra = categoriaActiva === 'Todas' ? '' : ' en ' + escaparHTML(categoriaActiva);
    grid.innerHTML = '<div class="vacio"><p>Aún no hay productos' + extra + '.</p>'
      + '<button class="boton-secundario" id="btnVacioAgregar">Agregar el primero</button></div>';
    document.getElementById('btnVacioAgregar').addEventListener('click', abrirPanelAgregar);
    return;
  }

  grid.innerHTML = filtrados
    .slice()
    .sort((a, b) => (b.fecha || 0) - (a.fecha || 0))
    .map((p) => (
      '<article class="tarjeta">'
      + '<img src="' + p.foto + '" alt="' + escaparHTML(p.descripcion) + '">'
      + '<div class="info">'
      + '<span class="categoria-tag">' + escaparHTML(p.categoria) + '</span>'
      + '<p class="descripcion">' + escaparHTML(p.descripcion) + '</p>'
      + '<div class="fila-inferior">'
      + '<span class="precio">' + formatearPrecio(p.precio) + '</span>'
      + '<button class="eliminar" data-id="' + p.id + '">Eliminar</button>'
      + '</div></div></article>'
    )).join('');

  grid.querySelectorAll('.tarjeta img').forEach((img) => {
    img.addEventListener('click', () => abrirVisor(img.src, img.alt));
  });

  grid.querySelectorAll('.eliminar').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (btn.dataset.confirmando !== '1') {
        btn.dataset.confirmando = '1';
        btn.classList.add('confirmando');
        btn.textContent = '¿Seguro? Toca de nuevo';
        setTimeout(() => {
          if (btn.dataset.confirmando === '1') {
            btn.dataset.confirmando = '0';
            btn.classList.remove('confirmando');
            btn.textContent = 'Eliminar';
          }
        }, 3000);
        return;
      }
      try {
        await deleteDoc(doc(db, 'productos', btn.dataset.id));
        mostrarAviso('Producto eliminado');
      } catch (err) {
        mostrarAviso('No se pudo eliminar, intenta de nuevo.');
      }
    });
  });
}

function poblarSelectCategorias() {
  const select = document.getElementById('inputCategoria');
  select.innerHTML = categorias.map((c) => '<option value="' + escaparHTML(c) + '">' + escaparHTML(c) + '</option>').join('');
}

function renderListaCategorias() {
  const ul = document.getElementById('listaCategorias');
  ul.innerHTML = categorias.map((c) => (
    '<li><span>' + escaparHTML(c) + '</span>'
    + '<button class="quitar-categoria" data-cat="' + escaparHTML(c) + '">Eliminar</button></li>'
  )).join('');
  ul.querySelectorAll('.quitar-categoria').forEach((btn) => {
    btn.addEventListener('click', async () => {
      const cat = btn.dataset.cat;
      const enUso = productosCache.some((p) => p.categoria === cat);
      if (enUso) {
        mostrarAviso('"' + cat + '" todavía tiene productos. Elimina o cambia esos productos antes de quitar la categoría.');
        return;
      }
      const nuevasCategorias = categorias.filter((c) => c !== cat);
      try {
        await setDoc(doc(db, 'config', 'categorias'), { lista: nuevasCategorias });
      } catch (err) {
        mostrarAviso('No se pudo quitar la categoría, intenta de nuevo.');
        return;
      }
      if (categoriaActiva === cat) {
        categoriaActiva = 'Todas';
        renderPestanas();
        renderGrid();
      }
    });
  });
}

// ---- Paneles ----
function abrirPanelAgregar() {
  document.getElementById('panelAgregar').classList.remove('oculto');
  document.getElementById('panelCategorias').classList.add('oculto');
  poblarSelectCategorias();
  document.getElementById('panelAgregar').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function cerrarPanelAgregar() {
  document.getElementById('panelAgregar').classList.add('oculto');
}
function alternarPanelCategorias() {
  document.getElementById('panelCategorias').classList.toggle('oculto');
  document.getElementById('panelAgregar').classList.add('oculto');
  renderListaCategorias();
}

// ---- Visor de foto ampliada ----
function abrirVisor(src, alt) {
  document.getElementById('visorFotoImg').src = src;
  document.getElementById('visorFotoImg').alt = alt || '';
  document.getElementById('visorFoto').classList.remove('oculto');
}
function cerrarVisor() {
  document.getElementById('visorFoto').classList.add('oculto');
  document.getElementById('visorFotoImg').src = '';
}
document.getElementById('cerrarVisor').addEventListener('click', cerrarVisor);
document.getElementById('visorFoto').addEventListener('click', (e) => {
  if (e.target.id === 'visorFoto') cerrarVisor();
});

// ---- Eventos de formulario de producto ----
document.getElementById('inputFoto').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  const prev = document.getElementById('previsualizacion');
  fotoPendiente = null;
  if (!file) { prev.innerHTML = ''; return; }
  prev.innerHTML = '<p class="cargando">Preparando foto…</p>';
  try {
    fotoPendiente = await procesarFoto(file);
    prev.innerHTML = '<img src="' + fotoPendiente + '" class="preview-img" alt="Vista previa">';
  } catch (err) {
    prev.innerHTML = '<p class="error">No se pudo leer la foto, intenta de nuevo.</p>';
  }
});

document.getElementById('formProducto').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!fotoPendiente) { mostrarAviso('Espera a que la foto termine de cargar, o selecciona una.'); return; }
  const descripcion = document.getElementById('inputDescripcion').value.trim();
  const precio = parseFloat(document.getElementById('inputPrecio').value);
  const categoria = document.getElementById('inputCategoria').value;
  if (!descripcion || isNaN(precio)) return;

  try {
    await addDoc(collection(db, 'productos'), { foto: fotoPendiente, descripcion, precio, categoria, fecha: Date.now() });
  } catch (err) {
    mostrarAviso('No se pudo guardar, intenta de nuevo.');
    return;
  }

  e.target.reset();
  document.getElementById('previsualizacion').innerHTML = '';
  fotoPendiente = null;
  cerrarPanelAgregar();
  categoriaActiva = categoria;
  renderPestanas();
  mostrarAviso('Producto agregado');
});

document.getElementById('btnAgregar').addEventListener('click', abrirPanelAgregar);
document.getElementById('btnCancelar').addEventListener('click', cerrarPanelAgregar);
document.getElementById('btnEditarCategorias').addEventListener('click', alternarPanelCategorias);

document.getElementById('btnAgregarCategoria').addEventListener('click', async () => {
  const input = document.getElementById('inputNuevaCategoria');
  const nombre = input.value.trim();
  if (!nombre) return;
  if (categorias.some((c) => c.toLowerCase() === nombre.toLowerCase())) {
    mostrarAviso('Esa categoría ya existe.');
    return;
  }
  const nuevasCategorias = categorias.concat([nombre]);
  try {
    await setDoc(doc(db, 'config', 'categorias'), { lista: nuevasCategorias });
    input.value = '';
  } catch (err) {
    mostrarAviso('No se pudo agregar, intenta de nuevo.');
  }
});

document.getElementById('inputNuevaCategoria').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    document.getElementById('btnAgregarCategoria').click();
  }
});
</script>
